name: Account transfer validation
on:
  pull_request:
    paths:
      - '.github/workflows/account-transfer-validation.yml'
      - 'lib/account-transfer.ts'
      - 'components/account-transfer-backup.tsx'
      - 'components/settings-menu.tsx'
      - 'tests/account-transfer.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check account transfer file formatting
        run: bunx oxfmt --check lib/account-transfer.ts components/account-transfer-backup.tsx components/settings-menu.tsx tests/account-transfer.spec.ts
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test versioned backup and hostile inputs
        run: bunx playwright test tests/account-transfer.spec.ts
      - name: Production build
        run: bun run build
