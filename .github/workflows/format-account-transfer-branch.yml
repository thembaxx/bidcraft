name: Format Bidcraft account transfer branch
on:
  push:
    branches: [feat/local-account-transfer-backup]
    paths:
      - '.github/workflows/format-account-transfer-branch.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'thembaxx/bidcraft' && github.actor == 'thembaxx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-account-transfer-backup
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Format only this feature's files
        run: bunx oxfmt --write lib/account-transfer.ts components/account-transfer-backup.tsx tests/account-transfer.spec.ts components/settings-menu.tsx
      - name: Format validation
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Commit format-only adjustments
        run: |
          git add -- lib/account-transfer.ts components/account-transfer-backup.tsx tests/account-transfer.spec.ts components/settings-menu.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(accounts): format validated account-transfer components'
          git push origin HEAD:refs/heads/feat/local-account-transfer-backup
