name: Temporary Oxfmt diff inspection
on:
  push:
    branches:
      - perf/brand-scene-visible-frames-oct30
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Show actual formatter changes
        run: |
          bunx oxfmt --write .github/workflows/account-transfer-validation.yml
          git diff -- .github/workflows/account-transfer-validation.yml
