name: Temporary Bidcraft mobile-format repair
on:
  push:
    branches: [ui/tender-mobile-legibility-20261104]
    paths:
      - .github/workflows/format-mobile-polish.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'thembaxx/bidcraft' && github.ref == 'refs/heads/ui/tender-mobile-legibility-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only the responsive tender stylesheet
        run: |
          set -euo pipefail
          bunx oxfmt --write components/tender-discovery/mobile-legibility.css
          git add -- components/tender-discovery/mobile-legibility.css
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: normalize tender mobile stylesheet'
            git push origin HEAD:ui/tender-mobile-legibility-20261104
          fi
