name: One-time TypeScript compatibility pin

on:
  push:
    branches: [chore/deps-latest-compatible-20261021]
    paths:
      - .github/workflows/pin-typescript-once.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/deps-latest-compatible-20261021
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin newest supported TypeScript 6 release
        run: |
          bun add --dev 'typescript@^6.0.0' --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
          node -e "const p=require('./package.json'); if(!p.devDependencies.typescript.startsWith('^6.')) process.exit(1); console.log('TypeScript compatibility pin:',p.devDependencies.typescript)"
      - name: Commit matching Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --check
          git commit -m "fix(deps): use latest TypeScript 6 supported by typescript-eslint"
          git push origin HEAD:chore/deps-latest-compatible-20261021
