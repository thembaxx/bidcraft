<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#309F92" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#1A2623" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0D0F0E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDFF8C" />
      <stop offset="52%" stop-color="#309F92" />
      <stop offset="100%" stop-color="#185C54" />
    </linearGradient>
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDFF8C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#309F92" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base inspired by IMG_5047_c312454a.jpeg -->
  <rect width="512" height="512" rx="118" fill="#0D0F0E" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#coreGlow)" stroke="url(#rimHighlight)" stroke-width="4" />

  <!-- Outer Concentric Precision Seal Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#309F92" stroke-width="3" stroke-dasharray="8 6" opacity="0.65" />
  <circle cx="256" cy="256" r="146" fill="none" stroke="#EDFF8C" stroke-width="2" opacity="0.35" />

  <!-- Geodesic Faceted Polyhedron / Architectural Star Crest -->
  <polygon points="256,88 378,158 378,354 256,424 134,354 134,158" fill="#121A18" stroke="url(#goldFacet)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="256,88 378,158 256,256" fill="#309F92" fill-opacity="0.32" stroke="#EDFF8C" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="378,158 378,354 256,256" fill="#309F92" fill-opacity="0.18" stroke="#309F92" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="378,354 256,424 256,256" fill="#0D0F0E" fill-opacity="0.65" stroke="#309F92" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="256,424 134,354 256,256" fill="#309F92" fill-opacity="0.24" stroke="#309F92" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="134,354 134,158 256,256" fill="#EDFF8C" fill-opacity="0.14" stroke="#EDFF8C" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="134,158 256,88 256,256" fill="#EDFF8C" fill-opacity="0.28" stroke="#EDFF8C" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner 3x3 Sovereign Vector Core Matrix -->
  <circle cx="206" cy="206" r="10" fill="#FFFFFF" />
  <circle cx="256" cy="206" r="10" fill="#FFFFFF" />
  <circle cx="306" cy="206" r="12" fill="#EDFF8C" />
  <circle cx="206" cy="256" r="10" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="18" fill="#EDFF8C" stroke="#0D0F0E" stroke-width="4" />
  <circle cx="306" cy="256" r="10" fill="#FFFFFF" />
  <circle cx="206" cy="306" r="10" fill="#FFFFFF" />
  <circle cx="256" cy="306" r="10" fill="#FFFFFF" />
  <circle cx="306" cy="306" r="10" fill="#309F92" />
